<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendario Honomásticos 2026</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>

    body{
      background: #eef2f7;
      font-family: 'Segoe UI', sans-serif;
    }

    .dashboard{
      min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar{
      background: #1f2937;
      color: white;
      min-height: 100vh;
      padding: 25px 20px;
      box-shadow: 4px 0 12px rgba(0,0,0,0.08);
    }

    .sidebar-title{
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .sidebar label{
      font-weight: 600;
      margin-bottom: 10px;
    }

    .legend-box{
      margin-top: 35px;
    }

    .legend-item{
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .legend-color{
      width: 18px;
      height: 18px;
      border-radius: 5px;
      margin-right: 10px;
    }

    .bg-primary-custom{
      background: #0d6efd;
    }

    .bg-success-custom{
      background: #198754;
    }

    .bg-danger-custom{
      background: #dc3545;
    }

    .bg-warning-custom{
      background: #fd7e14;
    }

    .bg-purple-custom{
      background: #6f42c1;
    }

    /* CONTENT */

    .content{
      padding: 30px;
    }

    .calendar-card{
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .calendar-header{
      background: linear-gradient(135deg, #0d6efd, #0b5ed7);
      color: white;
      padding: 20px;
    }

    .calendar-header h2{
      margin: 0;
      font-weight: bold;
    }

    table{
      margin-bottom: 0;
    }

    th{
      background: #f1f5f9;
      text-align: center;
      color: #374151;
      font-size: 0.95rem;
    }

    td{
      height: 120px;
      width: 14.2%;
      vertical-align: top;
      padding: 8px;
      background: white;
      transition: 0.2s;
    }

    td:hover{
      background: #edf5ff;
    }

    .empty{
      background: #f8fafc;
    }

    .day-number{
      font-weight: bold;
      color: #111827;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    /* EVENTOS */

    .event{
      display: block;
      padding: 4px 7px;
      border-radius: 8px;
      font-size: 0.72rem;
      color: white;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .event-primary{
      background: #0d6efd;
    }

    .event-success{
      background: #198754;
    }

    .event-danger{
      background: #dc3545;
    }

    .event-warning{
      background: #fd7e14;
    }

    .event-purple{
      background: #6f42c1;
    }

    @media(max-width:991px){

      .sidebar{
        min-height: auto;
      }

      td{
        height: 90px;
      }

      .event{
        font-size: 0.60rem;
      }
    }

  </style>
</head>

<body>

<div class="container-fluid dashboard">

  <div class="row">

    <!-- SIDEBAR -->
    <div class="col-lg-3 sidebar">

      <div class="sidebar-title">
        <i class="bi bi-calendar-event"></i>
        Cumpleaños 2026
      </div>

      <!-- SELECTOR -->
      <div class="mb-4">

        <label>
          Seleccionar Mes
        </label>

        <select id="monthSelector" class="form-select">

          <option value="0">Enero</option>
          <option value="1">Febrero</option>
          <option value="2">Marzo</option>
          <option value="3">Abril</option>
          <option value="4">Mayo</option>
          <option value="5">Junio</option>
          <option value="6">Julio</option>
          <option value="7">Agosto</option>
          <option value="8">Septiembre</option>
          <option value="9">Octubre</option>
          <option value="10">Noviembre</option>
          <option value="11">Diciembre</option>

        </select>

      </div>

      <!-- LEYENDA -->
      <div class="legend-box">

        <h5 class="mb-3">
          Etiquetas
        </h5>

        <div class="legend-item">
          <div class="legend-color bg-primary-custom"></div>
          Cumpleañeros
        </div>

        <!-- <div class="legend-item">
          <div class="legend-color bg-success-custom"></div>
          Capacitaciones
        </div>

        <div class="legend-item">
          <div class="legend-color bg-danger-custom"></div>
          Eventos Oficiales
        </div>

        <div class="legend-item">
          <div class="legend-color bg-warning-custom"></div>
          Cumpleaños
        </div>

        <div class="legend-item">
          <div class="legend-color bg-purple-custom"></div>
          Informes Técnicos
        </div> -->

      </div>

    </div>

    <!-- CONTENT -->
    <div class="col-lg-9 content">

      <div class="calendar-card">

        <div class="calendar-header">
          <h2 id="monthTitle">Enero 2026</h2>
        </div>

        <table class="table table-bordered mb-0">

          <thead>
            <tr>
              <th>Lun</th>
              <th>Mar</th>
              <th>Mié</th>
              <th>Jue</th>
              <th>Vie</th>
              <th>Sáb</th>
              <th>Dom</th>
            </tr>
          </thead>

          <tbody id="calendarBody"></tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script>

  const months = [
    "Enero", "Febrero", "Marzo", "Abril",
    "Mayo", "Junio", "Julio", "Agosto",
    "Septiembre", "Octubre", "Noviembre", "Diciembre"
  ];

  // EVENTOS DE EJEMPLO

  const events = {

    "0-15": [
      { text: "Mery Consuelo Vilca 🎁", class: "event-primary" }
    ],

    "0-20": [
      { text: "Margotti Gonzales 🎉", class: "event-primary" }
    ],

    "0-25": [
      { text: "Dayanita Yana 😘", class: "event-primary" }
    ],

    "2-1": [
      { text: "Luz Prado 🎁", class: "event-primary" }
    ],

    "3-14": [
      { text: "José Ticona 😂", class: "event-primary" }
    ],

    "3-19": [
      { text: "Angie Barriga 🎉", class: "event-primary" }
    ],

    "4-1": [
      { text: "Javier Gómez 👌", class: "event-primary" }
    ],

    "4-13": [
      { text: "Juanito Nina 👌", class: "event-primary" }
    ],

    "5-6": [
      { text: "Norberto Huamaní 😁", class: "event-primary" }
    ],

    "5-25": [
      { text: "Guillermo Gutiérrez 🎁", class: "event-primary" }
    ],

    "6-15": [
      { text: "Robertito TOTO..TOTO 🎁", class: "event-primary" }
    ],

    "9-20": [
      { text: "Jorge Chambi 👍", class: "event-primary" }
    ],

    "9-30": [
      { text: "Fé De Los Angeles 🎞️🎞️", class: "event-primary" }
    ],

    "10-20": [
      { text: "Mami Alonso ❤️", class: "event-primary" }
    ],

    "11-9": [
      { text: "Cecilia Dianderas 🎁🎉", class: "event-primary" }
    ],

  };

  const calendarBody = document.getElementById("calendarBody");
  const monthTitle = document.getElementById("monthTitle");
  const selector = document.getElementById("monthSelector");

  function generateCalendar(monthIndex){

    calendarBody.innerHTML = "";

    monthTitle.innerHTML = `${months[monthIndex]} 2026`;

    const firstDay = new Date(2026, monthIndex, 1);
    const lastDate = new Date(2026, monthIndex + 1, 0).getDate();

    let startDay = firstDay.getDay();
    startDay = startDay === 0 ? 6 : startDay - 1;

    let date = 1;

    for(let i = 0; i < 6; i++){

      let row = document.createElement("tr");

      for(let j = 0; j < 7; j++){

        let cell = document.createElement("td");

        if(i === 0 && j < startDay){

          cell.classList.add("empty");

        }
        else if(date > lastDate){

          cell.classList.add("empty");

        }
        else{

          // Numero de día
          let dayNumber = document.createElement("div");
          dayNumber.classList.add("day-number");
          dayNumber.innerHTML = date;

          cell.appendChild(dayNumber);

          // EVENTOS
          const eventKey = `${monthIndex}-${date}`;

          if(events[eventKey]){

            events[eventKey].forEach(event => {

              let eventDiv = document.createElement("div");

              eventDiv.classList.add("event");
              eventDiv.classList.add(event.class);

              eventDiv.innerHTML = event.text;

              cell.appendChild(eventDiv);

            });

          }

          date++;
        }

        row.appendChild(cell);
      }

      calendarBody.appendChild(row);

      if(date > lastDate){
        break;
      }
    }
  }

  // Cambio de mes
  selector.addEventListener("change", function(){

    generateCalendar(parseInt(this.value));

  });

  // Inicial
  generateCalendar(0);

</script>

</body>
</html>
